# 의존 버전은 여기 한 곳에 major.minor.patch로 고정한다(CLAUDE.md §3.4).
# §2.8 `environment`가 분석 도구 버전(pmd·archunit·jgit·git)을 산출물에 인쇄하고,
# `classes_reproduction_inputs`가 jdk·빌드 도구·컴파일 인자를 인쇄한다.
# 여기 값이 바뀌면 `analysis_input_id`가 바뀌어야 하며(D87), 픽스처 기대값이
# 움직이면 `fixture_change {reason: library_behavior_change}`가 필요하다(§2.9, P11).

[versions]
# --- §2.8 environment에 인쇄되는 셋 (증인 셋, B.1) ---
pmd = "7.16.0"              # 무엇인가 — 메트릭·quickstart 룰셋·CPD
archunit = "1.5.0"          # 어떻게 짜였나 — ClassFileImporter + ArchitectureMetrics
jgit = "7.3.0"              # 어떻게 행동했나 — log·diff (매 스캔 blame 없음, D18)
# JGit 아티팩트 버전에는 빌드 한정자가 붙는다. `environment.jgit`에 인쇄하는 값은
# 위의 major.minor.patch이고, 아래는 그것을 가리키는 좌표다.
jgitArtifact = "7.3.0.202506031305-r"

# --- §6.5 수정기 (네 번째 엔진이 아니다 — §11) ---
openrewrite = "8.66.0"

# --- 빌드·테스트 ---
java = "21"
junit = "5.14.2"
assertj = "3.27.6"

[libraries]
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
pmd-kotlin = { module = "net.sourceforge.pmd:pmd-kotlin", version.ref = "pmd" }
pmd-core = { module = "net.sourceforge.pmd:pmd-core", version.ref = "pmd" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgitArtifact" }
rewrite-java = { module = "org.openrewrite:rewrite-java", version.ref = "openrewrite" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[bundles]
# jqradar-core의 증인 셋(B.1). **네 번째 엔진을 추가하지 않는다**(§11).
engines = ["pmd-java", "pmd-kotlin", "pmd-core", "archunit", "jgit"]
